services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "127.0.0.1:18080:18080"
    volumes:
      - android-pessoal-data:/var/lib/android-pessoal/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  android-pessoal-data:
